name: debug-55 (диагностика падений CI 1.2.1)
# Временный диагностический пайплайн задачи task-55: CI по тегу v1.2.1 красный,
# и оба значимых падения — SIGSEGV (-11) движка на Linux:
#   * linux-aarch64, шаг «§63 public API freeze»: движок умирает на старте
#     (последние строки — манифест, «GPU-бэкенд: vulkan», окно);
#   * linux-x86_64, шаг «Linux SDK GUI regressions»: sdk_package_test запускает
#     упакованную игру (r2d-sdk run … --headless --frames 8) и получает -11.
# Логи GitHub отдают только с правами админа, а macOS-прогон зелёный, поэтому
# падение воспроизводится здесь — на тех же раннерах, но под ASan/UBSan и с
# печатью отчёта, чтобы получить точную первую упавшую строку и стек.
#
# Ветка/рана — временные: после диагноза файл удаляется.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Коммит/тег для проверки (пусто = эта ветка)'
        required: false
        default: ''
      sanitize:
        description: '1 = Debug+ASan/UBSan, 0 = Release (быстрый бисект)'
        required: false
        default: '1'
  push:
    branches: ['ci/task-55-debug']
permissions:
  contents: read
concurrency:
  group: debug-55-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true
jobs:
  repro:
    name: repro (${{ matrix.platform }}, ${{ inputs.ref || github.sha }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-x86_64, runner: ubuntu-24.04}
          - {platform: linux-aarch64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Что проверяем
        run: git log -1 --format='%h %ad %s' --date=iso
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libfreetype-dev patchelf \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev \
            libgl1-mesa-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libcurl4-openssl-dev xvfb mesa-vulkan-drivers gdb
      - name: Configure
        run: |
          if [ "${{ inputs.sanitize || '1' }}" = "1" ]; then
            cmake -S . -B build-dbg -DCMAKE_BUILD_TYPE=Debug -DR2D_SANITIZE=ON
          else
            cmake -S . -B build-dbg -DCMAKE_BUILD_TYPE=Release
          fi
      - name: Build engine and SDK
        # ASAN_OPTIONS на самой сборке: генератор r2d_embed_js течёт на 8 КБ, и
        # LeakSanitizer валит шаг генерации заголовка (проверено прогоном
        # 38959450934: «gmake … r2d_js_data.h Error 1», SUMMARY 8042 byte(s) leaked).
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          cmake --build build-dbg --config Debug --parallel 4 --target russiano2d
          # r2d-sdk нужен только сценарию C; в старых ref его может не быть.
          cmake --build build-dbg --config Debug --parallel 4 --target r2d-sdk \
            || echo "цели r2d-sdk нет — сценарий C будет пропущен"
      - name: Диагностика A — движок на фикстуре hello (падение aarch64)
        if: always()
        run: |
          set +e
          export ASAN_OPTIONS=detect_leaks=0:abort_on_error=0:log_path=/tmp/asan
          export UBSAN_OPTIONS=print_stacktrace=1
          echo "── A. старт движка без агента"
          timeout 60 xvfb-run -a build-dbg/russiano2d --headless --frames 4 \
            --game tests/fixtures/hello > /tmp/a_engine.log 2>&1
          echo "код: $?"
          tail -30 /tmp/a_engine.log
      - name: Диагностика B — гейт заморозки API (падение aarch64)
        if: always()
        run: |
          set +e
          export ASAN_OPTIONS=detect_leaks=0:abort_on_error=0:log_path=/tmp/asan
          export UBSAN_OPTIONS=print_stacktrace=1
          echo "── B. R2D_BINARY=build-dbg/russiano2d xvfb-run -a python3 tests/api_freeze_test.py"
          R2D_BINARY=build-dbg/russiano2d timeout 300 xvfb-run -a python3 tests/api_freeze_test.py \
            > /tmp/b_freeze.log 2>&1
          echo "код: $?"
          tail -40 /tmp/b_freeze.log
      - name: Диагностика C — упакованная игра через SDK (падение x86_64)
        if: always()
        run: |
          set +e
          export ASAN_OPTIONS=detect_leaks=0:abort_on_error=0:log_path=/tmp/asan
          export UBSAN_OPTIONS=print_stacktrace=1
          if [ ! -x build-dbg/r2d-sdk ]; then echo "r2d-sdk нет — сценарий C пропущен"; exit 0; fi
          rm -rf /tmp/pkg-game
          echo "── C1. r2d-sdk new blank"
          timeout 120 xvfb-run -a build-dbg/r2d-sdk new blank /tmp/pkg-game --name "Debug game" \
            > /tmp/c_new.log 2>&1
          echo "код: $?"; tail -5 /tmp/c_new.log
          echo "── C2. r2d-sdk run --headless --frames 8"
          timeout 120 xvfb-run -a build-dbg/r2d-sdk run /tmp/pkg-game --headless --frames 8 \
            > /tmp/c_run.log 2>&1
          echo "код: $?"; tail -30 /tmp/c_run.log
          echo "── C3. тот же движок напрямую (для сравнения с C2)"
          timeout 60 xvfb-run -a build-dbg/russiano2d --headless --frames 8 \
            --game /tmp/pkg-game > /tmp/c_engine.log 2>&1
          echo "код: $?"; tail -20 /tmp/c_engine.log
      - name: Отчёты санитайзеров
        if: always()
        run: |
          echo "── файлы ASan:"; ls -la /tmp/asan* 2>/dev/null || echo "нет"
          for f in /tmp/asan*; do
            [ -f "$f" ] || continue
            echo "── $f"; sed -n '1,60p' "$f"
          done
      - name: Ядро и бэктрейс
        if: always()
        run: |
          core=$(ls core* /tmp/core* 2>/dev/null | head -1)
          if [ -n "$core" ]; then
            echo "── ядро найдено: $core"
            gdb -batch -ex 'bt' build-dbg/russiano2d "$core" 2>&1 | head -40
          else
            echo "── файла ядра нет (раннер не пишет core)"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-55-${{ matrix.platform }}
          path: |
            /tmp/a_engine.log
            /tmp/b_freeze.log
            /tmp/c_new.log
            /tmp/c_run.log
            /tmp/c_engine.log
            /tmp/asan*
