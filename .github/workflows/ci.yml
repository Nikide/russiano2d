name: CI - Xmake build validation
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
jobs:
  linux-build-test:
    name: Linux x86_64 - r2d + native tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config m4 libfreetype-dev patchelf \
            glslang-tools spirv-cross \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev \
            libgl1-mesa-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libcurl4-openssl-dev mesa-vulkan-drivers
      - name: Configure and build the only executable
        run: |
          xmake f -y -p linux -a x86_64 -m release -o build-xmake/linux-x86_64
          xmake build -y -j 4 r2d
      - name: API documentation freshness
        env:
          R2D_BINARY: build-xmake/linux-x86_64/linux/x86_64/release/r2d
        run: python3 scripts/api_docs_pipeline.py check
      - name: Unity and JavaScript tests
        run: xmake test -y -j 4
      - name: Editor entry and code-first smoke
        env:
          R2D_BINARY: build-xmake/linux-x86_64/linux/x86_64/release/r2d
        run: |
          "$R2D_BINARY" commands --json
          "$R2D_BINARY" lint game --json
          "$R2D_BINARY" validate game --json

  windows-cross-build:
    name: Windows x86_64 - Xmake MinGW cross-build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 ninja-build pkg-config m4 zip glslang-tools spirv-cross
      - name: Configure and build r2d.exe
        run: |
          xmake f -y -p mingw -a x86_64 -m release -o build-xmake/windows-x86_64
          xmake build -y -j 4 r2d
