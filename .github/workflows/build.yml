name: Build and test
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake ninja-build pkg-config git ca-certificates \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev \
            libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev \
            libudev-dev libdbus-1-dev libfreetype-dev libcurl4-openssl-dev \
            xvfb mesa-vulkan-drivers
      - name: Configure
        run: cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build-ci --parallel 2
      - name: Native regression tests
        run: |
          set -eu
          for test in json crypto payload reverb audio_fx profile bsp rotsprite re2d re2d_world; do
            "./build-ci/tests/r2d_${test}_test"
          done
      - name: SDK native, batch and import regressions
        env:
          R2D_SDK_BINARY: build-ci/r2d-sdk
          R2D_BINARY: build-ci/russiano2d
          SDL_GPU_DRIVER: vulkan
        run: |
          ./build-ci/sdk/native/r2d_sdk_core_test
          ./build-ci/r2d-sdk batch tests/fixtures/sdk/ci.batch.json --output build-ci/sdk-ci-report.json
          xvfb-run -a python3 tests/agent/sdk_cli_test.py
          python3 tests/agent/sdk_expression_test.py
      - name: SDK data studios, OBJ import and UI mouse
        env:
          R2D_SDK_BINARY: build-ci/r2d-sdk
          R2D_BINARY: build-ci/russiano2d
          R2D_QJS: build-ci/_deps/quickjs-build/qjs
          SDL_GPU_DRIVER: vulkan
        run: |
          set -eu
          for test in sdk_kinds_test sdk_rml_test; do "$R2D_QJS" -m "tests/js/${test}.mjs"; done
          python3 tests/agent/sdk_data_parity_test.py
          python3 tests/agent/sdk_obj_test.py
          xvfb-run -a python3 tests/agent/ui_virtual_mouse_test.py
          xvfb-run -a python3 tests/agent/sdk_studios_test.py
      - name: Native SDK agent protocol parity
        env:
          R2D_SDK_BINARY: build-ci/r2d-sdk
          R2D_BINARY: build-ci/russiano2d
          SDK_SKIP_GUI: "1"
          SDL_GPU_DRIVER: vulkan
        run: xvfb-run -a python3 tests/agent/sdk_automation_test.py
      - name: SDK machine reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-reports
          path: |
            build-ci/sdk-ci-report.json
            build/sdk_automation/*.json
            build/sdk_automation/*.png
          if-no-files-found: warn
