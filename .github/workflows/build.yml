name: Build, test and release
# Владение сборками (RUSSIANO2D_PRODUCTION_POLISH.md §4.5–4.9, docs/RELEASING.md):
#
#   * GitHub runners собирают ТОЛЬКО Windows x86_64 и Linux x86_64/aarch64,
#     прогоняют их тесты, пакуют архивы, считают SHA256SUMS и создают ровно
#     один GitHub Release по тегу vX.Y.Z;
#   * macOS в матрице нет намеренно: он собирается, тестируется и пакуется
#     локально на рабочем Mac и прикладывается к уже созданному релизу
#     документированным шагом (tools/attach_macos_release.py). Дублировать
#     ту же работу hosted-раннером нельзя — это второй источник артефактов.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Быстрые платформо-независимые гейты: доки, переносимость, контракт версии и
  # упаковки. Идут первыми и в одном экземпляре, чтобы сборка не тратила
  # полтора часа на ревизию, где уже разошлась документация или имя артефакта.
  static:
    name: static gates (docs, portability, version)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Version tag matches project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'tools')
          import release
          expected = 'v' + release.read_version()
          actual = os.environ['GITHUB_REF_NAME']
          assert actual == expected, 'тег %s не совпадает с версией проекта %s' % (actual, expected)
          print('  ok   тег %s == версия проекта' % actual)
          PY
      - name: Portability gates (M_PI, strtok_r, VLA)
        run: python3 tests/portability_test.py
      - name: Documentation gates
        run: |
          python3 tests/doc_coverage_test.py
          python3 tests/doc_claims_test.py
          python3 tests/api_docs_sync_test.py
          python3 tests/release_notes_test.py
          python3 tests/format_extensions_test.py
          python3 tests/checklist_test.py
          python3 tests/acceptance_test.py
          python3 tests/repository_hygiene_test.py
      - name: Packaging contract (artifact name, deterministic archive)
        run: |
          python3 tests/package_docs_refresh_test.py
          python3 tests/release_ownership_test.py
      - name: §66 acceptance checklist (evidence or reason for every item)
        run: python3 tests/production_polish_checklist_test.py
  build:
    needs: static
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-x86_64, runner: ubuntu-24.04}
          - {platform: linux-aarch64, runner: ubuntu-24.04-arm}
          # Windows собирается кросс-сборкой MinGW на ubuntu-раннере.
          # Причина: MSVC 14.44.35207 на windows-2022 падает внутренней ошибкой
          # CL.exe в кодогенерации нашего проекта (проверены /Zf, /Z7, снятие /MP,
          # /O1 — не помогают), а Windows-артефакт нужен. Инструменты те же, что
          # на Mos.Hub и GitVerse: один тулчейн на всех хостах. Наблюдение за MSVC
          # осталось отдельной необязательной задачей windows-msvc-diagnostic.
          - {platform: windows-x86_64, runner: ubuntu-24.04}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libfreetype-dev patchelf \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev \
            libgl1-mesa-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libcurl4-openssl-dev xvfb mesa-vulkan-drivers
          if [[ "${{ matrix.platform }}" == windows-x86_64 ]]; then
            # Кросс-сборка: mingw-w64 и хост-инструменты шейдеров (glslang-cross
            # собирает SPIR-V на хосте), плюс FreeType под MinGW — его в Ubuntu
            # для mingw нет, собираем статически из исходников.
            sudo apt-get install -y mingw-w64 xz-utils zip glslang-tools spirv-cross
            curl -fL --connect-timeout 10 --max-time 300 --retry 5 --retry-delay 3 \
              -o /tmp/freetype.tar.xz \
              "https://archive.ubuntu.com/ubuntu/pool/main/f/freetype/freetype_2.13.2+dfsg.orig.tar.xz"
            echo "48c78a4194adfcd15a4d089f3206dab8454c311f5577f3ef7eaef95f777f86e6  /tmp/freetype.tar.xz" | sha256sum -c -
            mkdir -p /tmp/freetype && tar -xJf /tmp/freetype.tar.xz -C /tmp/freetype --strip-components=1
            ( cd /tmp/freetype
              ./configure --host=x86_64-w64-mingw32 --prefix=/usr/x86_64-w64-mingw32 \
                --without-harfbuzz --without-bzip2 --without-brotli --without-png --without-zlib \
                --enable-static --disable-shared >/tmp/freetype.log 2>&1
              make -j"$(nproc)" >>/tmp/freetype.log 2>&1 && sudo make install >>/tmp/freetype.log 2>&1 )
          fi
      - name: Configure (RE2D on)
        run: |
          flags=()
          if [[ "$RUNNER_OS" == Windows ]]; then
            flags+=("-DR2D_BUNDLED_FREETYPE=ON" '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>')
          fi
          if [[ "${{ matrix.platform }}" == windows-x86_64 ]]; then
            # Кросс-сборка MinGW (см. комментарий у матрицы выше): те же флаги,
            # что у tools/autobuild.py и у пайплайнов Mos.Hub/GitVerse.
            flags+=("-DCMAKE_SYSTEM_NAME=Windows"
                    "-DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc"
                    "-DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++"
                    "-DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres"
                    "-DCMAKE_FIND_ROOT_PATH=/usr/x86_64-w64-mingw32"
                    "-DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER"
                    "-DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY"
                    "-DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY")
          fi
          cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release "${flags[@]}"
      - name: Build engine and SDK (RE2D on)
        run: |
          # Windows: 2 параллельных проекта вместо 4 — внутренняя ошибка CL.exe
          # в исходниках RmlUi Debugger возникает при параллельной сборке
          # (стек CloseTypeServerPDB), а раннер выдаёт 7 ГБ на всех.
          parallel=4
          msbuild_props=()
          if [[ "$RUNNER_OS" == Windows ]]; then parallel=2; fi
          cmake --build build-ci --config Release --parallel "$parallel" "${msbuild_props[@]}"
      - name: Configure (RE2D off)
        run: |
          flags=()
          if [[ "$RUNNER_OS" == Windows ]]; then
            flags+=("-DR2D_BUNDLED_FREETYPE=ON" '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>')
          fi
          if [[ "${{ matrix.platform }}" == windows-x86_64 ]]; then
            flags+=("-DCMAKE_SYSTEM_NAME=Windows"
                    "-DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc"
                    "-DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++"
                    "-DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres"
                    "-DCMAKE_FIND_ROOT_PATH=/usr/x86_64-w64-mingw32"
                    "-DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER"
                    "-DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY"
                    "-DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY")
          fi
          cmake -S . -B build-2d-ci -DCMAKE_BUILD_TYPE=Release -DR2D_ENABLE_RE2D=OFF "${flags[@]}"
      - name: Build engine and SDK (RE2D off)
        run: cmake --build build-2d-ci --config Release --parallel 4
      - name: Native and JavaScript tests (RE2D on)
        # Для windows-кросс-сборки прогон невозможен: бинарник под Windows, а
        # раннер — Linux (Wine в образе нет). Это осознанное ограничение, а не
        # тихий пропуск: код движка тот же, что проверяется на Linux-раннерах,
        # а сам Windows-пакет проверяется контрактом упаковки.
        if: matrix.platform != 'windows-x86_64'
        run: python tools/ci_verify.py --build-dir build-ci --re2d on
      - name: Native and JavaScript tests (RE2D off)
        if: matrix.platform != 'windows-x86_64'
        run: python tools/ci_verify.py --build-dir build-2d-ci --re2d off
      - name: Web export (honest skip without emsdk)
        if: matrix.platform != 'windows-x86_64'
        run: python tools/ci_verify.py --build-dir build-ci --web
      - name: §63 public API freeze (surface matches the snapshot)
        # Гейту нужен собранный движок (он снимает поверхность с живого `$`),
        # поэтому он живёт здесь, а не в статическом шаге: там бинарника нет.
        # Для windows-кросс-сборки пропускается — бинарник под Windows, а
        # раннер Linux.
        if: matrix.platform != 'windows-x86_64'
        # Через xvfb: гейт запускает движок, а на раннере нет видеодисплея
        # (SDL_Init: No available video device — так же, как у SDK-регрессий).
        run: R2D_BINARY=build-ci/russiano2d xvfb-run -a python3 tests/api_freeze_test.py
      - name: Linux SDK GUI regressions
        # Только настоящий Linux: у windows-кросс-сборки раннер тоже Linux, но
        # бинарник под Windows и запустить его здесь нельзя.
        if: runner.os == 'Linux' && matrix.platform != 'windows-x86_64'
        env:
          R2D_SDK_BINARY: build-ci/r2d-sdk
          R2D_BINARY: build-ci/russiano2d
          SDL_GPU_DRIVER: vulkan
          # Mesa 25.2.8 (lavapipe) падает SIGSEGV внутри vkCreateGraphicsPipelines,
          # когда её ДИСКОВЫЙ кэш шейдеров уже прогрет предыдущим запуском движка
          # в том же job: первый запуск кэш пишет, следующий падает ещё до события
          # ready. Воспроизведено в контейнере с той же версией mesa: холодный
          # кэш — 0, прогретый — 139. Одного MESA_SHADER_CACHE_DISABLE мало
          # (на 4-м запуске падение возвращалось), поэтому ниже каждый тест
          # получает СВОЙ пустой каталог кэша. Кэш шейдеров здесь не нужен: шаг
          # проверяет SDK, а не скорость компиляции шейдеров.
          MESA_SHADER_CACHE_DISABLE: "true"
        run: |
          # Каждый тест — отдельный запуск с пустым каталогом кэша: тогда
          # lavapipe никогда не читает прогретый кэш, а в логе видно, какой
          # именно тест упал (раньше шаг падал целиком без указания теста).
          fail=0
          for t in sdk_cli_test sdk_studios_test sdk_package_test build_test ui_virtual_mouse_test; do
            echo "── $t"
            if MESA_SHADER_CACHE_DIR="$(mktemp -d)" xvfb-run -a python3 "tests/agent/$t.py"; then
              echo "── $t: ok"
            else
              echo "── $t: FAIL"; fail=1
            fi
          done
          exit "$fail"
      # Re2D World acceptance and golden images (re2d_world_renderer_test.py,
      # sdk_world_studio_test.py, re2d_world_acceptance_test.py, re2d_dust2_test.py,
      # tools/re2d_world_goldens.py) убраны вместе с 3D-авторингом SDK: команды
      # world-compile/world-info и экран World Studio из r2d-sdk вырезаны.
      - name: Package engine, SDK and docs
        run: python tools/ci_package.py --build-dir build-ci --platform '${{ matrix.platform }}'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist-ci/*.tar.gz
            dist-ci/*.zip
          if-no-files-found: error
  # Наблюдение за MSVC: сборка Windows родным компилятором. Сейчас она падает
  # внутренней ошибкой CL.exe (см. комментарий у матрицы), поэтому задача
  # необязательная: падение не блокирует релиз, но остаётся видимым в CI. Когда
  # раннер обновит тулчейн, задача станет зелёной — тогда Windows можно вернуть
  # на MSVC (артефакт при этом собирается MinGW-кросс-сборкой и не меняется).
  windows-msvc-diagnostic:
    needs: static
    runs-on: windows-2022
    continue-on-error: true
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Configure (MSVC, Release)
        run: |
          cmake -S . -B build-msvc -DCMAKE_BUILD_TYPE=Release \
            -DR2D_BUNDLED_FREETYPE=ON \
            '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>'
      - name: Build engine (MSVC)
        run: cmake --build build-msvc --config Release --parallel 2

  # Единственный владелец GitHub Releases: локальный скрипт релиз не создаёт
  # никогда. Один тег — один релиз; архивов ровно столько, сколько платформ
  # собирает CI (macOS прикладывается позже и пересчитывает SHA256SUMS).
  release:
    needs: [static, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Заметки релиза лежат в репозитории (dist/RELEASE_NOTES_<версия>.md — их
      # пишет tools/release_notes.py на шаге bump локального выпуска), поэтому
      # релизному job'у нужен checkout: без него тело релиза собирать не из чего.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts
      - name: Verify archives match the release artifact contract
        run: |
          set -eu
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          import release
          from pathlib import Path
          version = release.read_version()
          expected = sorted(release.archive_name(p, version)
                            for p in ('linux-x86_64', 'linux-aarch64', 'windows-x86_64'))
          actual = sorted(f.name for f in Path('artifacts').iterdir() if f.is_file())
          assert actual == expected, 'архивы не совпали с контрактом:\n  ждали: %s\n  нашли: %s' % (expected, actual)
          print('  ok   архивы по контракту: %s' % ', '.join(actual))
          PY
      - name: Checksums
        run: |
          set -eu
          cd artifacts
          # Явный список файлов: `sha256sum *` захватил бы сам SHA256SUMS.txt —
          # он создаётся редиректом до раскрытия маски, и в опубликованный
          # манифест попадала строка с хешем пустого файла.
          rm -f SHA256SUMS.txt
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 3
          cat SHA256SUMS.txt
      - name: Publish the single release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          # Тело релиза — из заметок репозитория (tools/release_notes.py), плюс
          # честная приписка о том, что macOS прикладывается отдельным шагом.
          version="${GITHUB_REF_NAME#v}"
          notes_file="dist/RELEASE_NOTES_${version}.md"
          platform_text="Windows и Linux собраны GitHub Actions. macOS (arm64, x86_64) собирается локально на рабочем Mac, проверяется там же и прикладывается к этому релизу шагом \`python3 tools/attach_macos_release.py\`; после него в SHA256SUMS.txt пять архивов. До этого момента релиз неполный."
          if [ -f "$notes_file" ]; then
            { cat "$notes_file"; printf '\n---\n\n%s\n' "$platform_text"; } > release-body.md
            echo "тело релиза собрано из $notes_file"
          else
            printf 'Заметок %s в репозитории нет — релиз без них.\n\n%s\n' "$notes_file" "$platform_text" > release-body.md
            echo "!! в репозитории нет $notes_file — тело релиза только из приписки"
          fi
          cd artifacts
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Повторный прогон workflow не должен затирать манифест: к этому
            # моменту к релизу уже могли приложить macOS-архивы, и в
            # SHA256SUMS.txt пять строк вместо трёх.
            echo "релиз $GITHUB_REF_NAME уже существует — прикладываю только архивы, манифест не перезаписываю"
            gh release upload "$GITHUB_REF_NAME" ./*.tar.gz ./*.zip --clobber
          else
            # macOS здесь сознательно отсутствует: он собирается локально и
            # добавляется отдельным документированным шагом к ЭТОМУ релизу.
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "Russiano2D $GITHUB_REF_NAME" --notes-file ../release-body.md
            gh release upload "$GITHUB_REF_NAME" ./* --clobber
          fi
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort
