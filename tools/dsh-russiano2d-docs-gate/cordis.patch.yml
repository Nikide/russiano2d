# Патч бандла Russiano2D gate.
#
# Ставит в композицию профиля один хост-плагин с двумя доктринами:
#   1. сначала философия — потом работа (docs/PHILOSOPHY.md целиком);
#   2. ГЛАВНЫЙ ГЕЙТ: движок только 2D (PHILOSOPHY.md §3).
# Страж регистрируется в глобальном слое реестра инструментов, поэтому действует
# на всех агентов профиля — включая сабагентов, тимейтов и детей workflow:
# делегирование правило не отменяет.
#
# Настройки можно переопределить в cordis.patch.yml профиля, адресуя строку по id:
#
#   - id: russiano2d-docs-gate
#     name: 'dsh-russiano2d-docs-gate'
#     config:
#       enabled: true
#       minCoverage: 1
#       docs:
#         - { id: philosophy, path: docs/PHILOSOPHY.md, title: "Философия Russiano2D — конституция движка" }
#       law2d:
#         enabled: true
#         allowPaths: ['src/legacy/spornee.c']
#
# Список документов, шаблоны «команда пишет файлы», правила «только 2D» и тексты
# отказов живут в lib/policy.cjs и перечитываются с диска при каждой загрузке
# композиции.
- insert:
    - id: russiano2d-docs-gate
      name: 'dsh-russiano2d-docs-gate'
