<!doctype html>
<!--
  HTML-оболочка веб-сборки russiano2d (Emscripten --shell-file).

  Сделана по образцу веб-экспорта Godot: сначала экран загрузки (маскот, полоса
  прогресса, надпись), потом кнопка «Играть», и только по ней запускается
  движок. Кнопка нужна не для красоты: браузеры не дают запускать звук без
  действия пользователя, а движок поднимает аудиоустройство при старте
  (SDL_INIT_AUDIO). Поэтому main() вызывается из обработчика клика
  (-sINVOKE_RUN=0, Module.callMain).

  Аргументы движка берутся из адресной строки:
      /russiano2d.html?args=--frames,120,маска
      /russiano2d.html?autostart=1          — сразу «Играть» (для автотестов)

  Страница ещё и «рассказывает» о прогрессе: маячки /__r2d_progress уходят на
  сервер дымового прогона (tests/web/smoke.py), поэтому при зависшем кадре
  видно, докуда дошёл движок.
-->
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Russiano2D</title>
    <link rel="icon" href="russiano2d.png">
    <style>
        :root { --bg: #0d1117; --panel: #161b22; --line: #30363d; --text: #e6edf3; --dim: #8b949e; }

        * { box-sizing: border-box; }

        html, body {
            margin: 0; height: 100%; background: var(--bg); color: var(--text);
            font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* --- Экран загрузки --- */
        #boot {
            position: absolute; inset: 0; z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 18px; padding: 24px; text-align: center;
            background: radial-gradient(120% 120% at 50% 0%, #1b2230 0%, var(--bg) 60%);
            transition: opacity .45s ease;
        }
        /* Оверлей не убирается из раскладки, а гаснет: смена display меняет
           размер canvas и провоцирует resize — см. комментарий у #stage-wrap. */
        #boot.hidden { opacity: 0; pointer-events: none; }

        #boot-logo {
            max-width: min(620px, 78vw); max-height: 52vh;
            image-rendering: pixelated;
            filter: drop-shadow(0 12px 32px rgba(0, 0, 0, .55));
        }

        #boot-bar {
            width: min(420px, 70vw); height: 8px; border-radius: 999px;
            background: var(--panel); border: 1px solid var(--line); overflow: hidden;
        }
        #boot-fill {
            height: 100%; width: 0%; border-radius: 999px;
            background: linear-gradient(90deg, #2ea043, #7ad07a);
            transition: width .18s ease-out;
        }
        #boot-bar.indeterminate #boot-fill { width: 35%; animation: slide 1.1s ease-in-out infinite; }
        @keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }

        #boot-status { color: var(--dim); font-size: 13px; min-height: 1.5em; }

        #boot-start {
            margin-top: 6px; padding: 12px 42px; font-size: 16px; font-weight: 600;
            color: #06210c; background: linear-gradient(180deg, #8ee89a, #2ea043);
            border: 0; border-radius: 10px; cursor: pointer;
            box-shadow: 0 6px 18px rgba(46, 160, 67, .35);
            display: none;
        }
        #boot-start:enabled:hover { filter: brightness(1.06); }
        #boot-start:disabled { opacity: .45; cursor: default; }
        #boot-start.shown { display: inline-block; }

        #boot-error { color: #ff7b72; font-size: 13px; max-width: 70ch; white-space: pre-wrap; }

        /* --- Игровая сцена: ровно 16:9, canvas заполняет её целиком ---
           Сцена стоит в раскладке С САМОГО НАЧАЛА (её закрывает оверлей
           загрузки). Это не косметика: если показать canvas только при старте,
           браузер пришлёт resize, а он приходит в wasm, пока тот «спит» в
           Asyncify на создании WebGPU-устройства — и куча рушится
           («memory access out of bounds» в SDL_PushEvent). Стабильная
           раскладка = ни одного события в этот момент. */
        #stage-wrap {
            position: absolute; inset: 0; z-index: 5;
            display: flex; align-items: center; justify-content: center;
            background: #000;
        }

        #stage {
            position: relative;
            width: min(100vw, calc(100vh * 16 / 9));
            height: min(100vh, calc(100vw * 9 / 16));
            background: #000;
        }
        #canvas { display: block; width: 100%; height: 100%; outline: none; }

        /* Ввод отдаём движку только после первого кадра: до этого любое
           событие мыши заходит в wasm в неудачный момент (та же беда, что с
           resize). Курсор над сценой при этом ничего не ломает. */
        body:not(.running) #canvas { pointer-events: none; }

        #hud {
            position: absolute; right: 10px; bottom: 10px; z-index: 6;
            display: flex; gap: 8px; opacity: .35; transition: opacity .15s;
        }
        #hud:hover { opacity: 1; }
        #hud button {
            padding: 6px 12px; font: inherit; font-size: 12px; color: var(--text);
            background: rgba(22, 27, 34, .85); border: 1px solid var(--line);
            border-radius: 8px; cursor: pointer;
        }

        /* Журнал движка: виден только в отладочном режиме (?debug=1) — он же
           остаётся в DOM для --dump-dom автотеста. */
        #log {
            position: absolute; left: 0; bottom: 0; z-index: 7; max-height: 34vh;
            width: 100%; padding: 8px 12px; overflow: hidden; white-space: pre-wrap;
            font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; color: var(--dim);
            background: linear-gradient(180deg, rgba(13, 17, 23, 0), rgba(13, 17, 23, .92) 30%);
            pointer-events: none;
        }
        body:not(.debug) #log { display: none; }
        #result { display: none; }
    </style>
</head>
<body>
    <div id="boot">
        <img id="boot-logo" src="@R2D_WEB_LOADER_IMAGE_NAME@" alt="Маскот Russiano2D">
        <div id="boot-bar"><div id="boot-fill"></div></div>
        <div id="boot-status">Инициализация P2D</div>
        <button id="boot-start" disabled>Играть</button>
        <div id="boot-error"></div>
    </div>

    <div id="stage-wrap">
        <div id="stage">
            <canvas id="canvas" tabindex="0"></canvas>
        </div>
    </div>

    <div id="hud">
        <button id="btn-fullscreen" title="Полный экран (F11 у браузера — тоже работает)">⛶ Полный экран</button>
    </div>

    <div id="log"></div>
    <div id="result">R2D-WEB-SMOKE: pending</div>

<script>
    var query = new URLSearchParams(location.search);
    var args = (query.get('args') || '').split(',').filter(function (a) { return a.length > 0; });
    // Настройки экспорта (подставляет CMake при конфигурации веб-сборки):
    //   R2D_WEB_FORCE_PLAY — сразу начинать игру, без кнопки «Играть»;
    //   ?autostart=1 в адресной строке делает то же самое для тестов.
    var forcePlay = @R2D_WEB_FORCE_PLAY_JS@;
    var autostart = forcePlay || query.get('autostart') === '1';
    if (query.get('debug') === '1') document.body.classList.add('debug');

    var bootEl = document.getElementById('boot');
    var statusEl = document.getElementById('boot-status');
    var fillEl = document.getElementById('boot-fill');
    var barEl = document.getElementById('boot-bar');
    var startEl = document.getElementById('boot-start');
    var errorEl = document.getElementById('boot-error');
    var stageEl = document.getElementById('stage-wrap');
    var logEl = document.getElementById('log');
    var resultEl = document.getElementById('result');
    var canvasEl = document.getElementById('canvas');
    var startedAt = Date.now();
    var engineStarted = false;

    // --- Маячки прогресса -----------------------------------------------------
    // Нужны дымовому прогону: если кадр виснет, DOM уже не прочитать, а по этим
    // меткам видно, докуда движок дошёл. Ответ не нужен, ошибки глотаем.
    function report(stage, detail) {
        try {
            var url = '/__r2d_progress?stage=' + encodeURIComponent(stage)
                    + '&detail=' + encodeURIComponent(String(detail || '').slice(0, 300));
            fetch(url, { keepalive: true, cache: 'no-store' }).catch(function () {});
        } catch (e) { /* маячок не обязателен */ }
    }
    report('page', args.join(' ') + (autostart ? ' autostart' : ''));
    // Тот же маячок доступен движку: из C он отмечает шаги завершения
    // (r2d__shutdown), чтобы было видно, на каком именно шаге страница залипает.
    window.__r2dReport = report;

    // --- Журнал движка --------------------------------------------------------
    function appendLog(prefix, text) {
        var lines = (logEl.textContent + prefix + text + '\n').split('\n');
        logEl.textContent = lines.slice(-60).join('\n');
    }

    function setProgress(percent, text) {
        if (percent === null) {
            barEl.classList.add('indeterminate');
        } else {
            barEl.classList.remove('indeterminate');
            fillEl.style.width = Math.max(0, Math.min(100, percent)).toFixed(1) + '%';
        }
        // Постоянная подпись под полосой — «Инициализация P2D»; подробности
        // загрузки дописываются к ней, а не затирают её.
        statusEl.textContent = text ? 'Инициализация P2D — ' + text : 'Инициализация P2D';
    }

    function fail(message) {
        errorEl.textContent = message;
        resultEl.textContent = 'R2D-WEB-SMOKE: abort ' + message;
        report('abort', message);
    }

    // --- Запуск движка по кнопке ---------------------------------------------
    // Экран загрузки не исчезает по клику: движок сначала полностью поднимается
    // (GPU-устройство, шрифты, звук, сцена), и только после ПЕРВОГО кадра
    // страница гаснет и отдаёт ввод — см. window.__r2dOnFirstFrame.
    function startGame() {
        if (engineStarted) return;
        engineStarted = true;
        startEl.disabled = true;
        setProgress(null, 'запускаю движок…');
        report('start', args.join(' '));
        // Клик по кнопке — это и есть «жест пользователя», без которого браузер
        // не даёт открыть аудиоустройство.
        if (typeof Module.callMain === 'function') {
            try {
                Module.callMain(args);
            } catch (e) {
                // Emscripten при simulate_infinite_loop разворачивает стек
                // служебным исключением — это НЕ ошибка.
                var unwind = (typeof e === 'string' && e.indexOf('unwind') >= 0)
                          || (e && e.name === 'ExitStatus');
                if (!unwind) {
                    fail('callMain: ' + (e && e.stack ? e.stack : e));
                }
            }
        }
    }

    // Вызывается движком (src/main.c) после первого отрисованного кадра.
    window.__r2dOnFirstFrame = function () {
        document.body.classList.add('running');
        bootEl.classList.add('hidden');
        canvasEl.focus();
        report('first-frame', '');
    };

    // Страховка: если движок не подал признак за минуту (например, сборка без
    // этого хука), не держим игрока на экране загрузки вечно.
    setTimeout(function () {
        if (engineStarted && !document.body.classList.contains('running')) {
            document.body.classList.add('running');
            bootEl.classList.add('hidden');
        }
    }, 60000);

    startEl.addEventListener('click', startGame);
    document.getElementById('btn-fullscreen').addEventListener('click', function () {
        var el = document.getElementById('stage');
        if (document.fullscreenElement) document.exitFullscreen();
        else if (el.requestFullscreen) el.requestFullscreen();
    });

    // --- Модуль Emscripten ----------------------------------------------------
    var Module = {
        arguments: args,
        canvas: canvasEl,
        print: function (text) { appendLog('[r2d] ', text); report('log', text); },
        printErr: function (text) { appendLog('[r2d:err] ', text); report('err', text); },
        // Emscripten зовёт это с текстом вида
        // «Downloading data... (1234/5678)» — отсюда берём проценты.
        setStatus: function (text) {
            if (!text) return;
            var m = text.match(/\((\d+)\s*\/\s*(\d+)\)/);
            if (m && Number(m[2]) > 0) {
                var percent = 100 * Number(m[1]) / Number(m[2]);
                setProgress(percent, text.replace(/\s*\(\d+\s*\/\s*\d+\)\s*$/, '')
                    + ' — ' + percent.toFixed(0) + '%');
            } else {
                setProgress(null, text);
            }
            report('status', text);
        },
        onRuntimeInitialized: function () {
            setProgress(100, 'готово. Нажмите «Играть».');
            startEl.disabled = false;
            startEl.classList.add('shown');
            report('ready', '');
            if (autostart) setTimeout(startGame, 0);
        },
        onAbort: function (what) {
            fail('движок прервал работу: ' + what);
        },
        monitorRunDependencies: function (left) {
            if (left === 0) {
                setProgress(null, 'Запускаю движок…');
                report('wasm-ready', '');
            }
        }
    };

    // --- Проверка кадра (для автотеста) --------------------------------------
    // Сколько разных цветов и светлых пикселей на canvas. Чёрный кадр даёт
    // colors=1 bright=0, живая сцена — двузначные числа; этого хватает, чтобы
    // отличить «нарисовалось» от «окно открылось, но пусто», не таща в CI
    // библиотеку картинок.
    //
    // Ноль по ширине/высоте — это НЕ «чёрный кадр»: после остановки движка
    // canvas освобождается и становится нулевым, а drawImage на таком падает
    // (InvalidStateError). Поэтому статистику снимаем ещё в работе (таймером
    // ниже) и запоминаем последнюю непустую.
    function frameStats() {
        if (!canvasEl.width || !canvasEl.height) return null;
        var small = document.createElement('canvas');
        small.width = 64;
        small.height = 36;
        var ctx = small.getContext('2d');
        ctx.drawImage(canvasEl, 0, 0, small.width, small.height);
        var data = ctx.getImageData(0, 0, small.width, small.height).data;
        var colors = new Set();
        var bright = 0;
        for (var i = 0; i < data.length; i += 4) {
            colors.add((data[i] >> 4) + ',' + (data[i + 1] >> 4) + ',' + (data[i + 2] >> 4));
            if (data[i] + data[i + 1] + data[i + 2] > 150) bright++;
        }
        return { colors: colors.size, bright: bright, total: data.length / 4 };
    }

    var lastStats = null;
    var canvasReported = false;
    setInterval(function () {
        if (!canvasReported && canvasEl.width > 0 && canvasEl.height > 0) {
            canvasReported = true;
            report('canvas', canvasEl.width + 'x' + canvasEl.height
                + ' client ' + canvasEl.clientWidth + 'x' + canvasEl.clientHeight);
        }
        var s = frameStats();
        // Держим самый «богатый» кадр: после остановки движка canvas
        // освобождается, и снять статистику уже не с чего.
        if (s && (!lastStats || s.bright > lastStats.bright)) lastStats = s;
    }, 500);

    var deadline = Date.now() + 180000;
    function watch() {
        if (window.__r2dStopped) {
            var s = frameStats() || lastStats;
            if (!s) {
                resultEl.textContent = 'R2D-WEB-SMOKE: no-frame (canvas пуст)';
                report('stopped', resultEl.textContent);
                return;
            }
            var ok = s.colors > 4 && s.bright > 20;
            resultEl.textContent = 'R2D-WEB-SMOKE: ' + (ok ? 'ok' : 'fail')
                + ' colors=' + s.colors + ' bright=' + s.bright + '/' + s.total
                + ' ms=' + (Date.now() - startedAt);
            report('stopped', resultEl.textContent);
            return;
        }
        if (Date.now() > deadline) {
            resultEl.textContent = 'R2D-WEB-SMOKE: timeout after '
                + Math.round((Date.now() - startedAt) / 1000) + 's';
            report('stopped', resultEl.textContent);
            return;
        }
        setTimeout(watch, 200);
    }
    setTimeout(watch, 500);
</script>
{{{ SCRIPT }}}
</body>
</html>
