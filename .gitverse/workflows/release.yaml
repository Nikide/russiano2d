# ===========================================================================
# CI/CD для gitverse.ru — единственный пайплайн проекта.
#
# Что делает: по тегу vX.Y.Z собирает Linux (нативно) и Windows (кросс-сборка
# MinGW), упаковывает штатным tools/release.py --package-only и публикует
# архивы в GitVerse Releases.
#
# macOS тут НЕ собирается: его собирает локальный build_and_push.sh и кладёт
# в dist/. В релиз на GitVerse уходят только Linux и Windows.
#
# Почему без Docker. Облачный раннер GitVerse — это уже изолированный
# контейнер, Docker внутри него недоступен. Тот же код, что и локально,
# собирает Linux нативно, а Windows — mingw-w64 на этой же машине
# (tools/autobuild.py --no-docker).
#
# ЛИМИТ ВРЕМЕНИ. У облачных раннеров GitVerse задача живёт максимум 30 минут.
# Поэтому Linux и Windows — два ПАРАЛЛЕЛЬНЫХ job'а: у каждого свой бюджет, и
# они не отнимают время друг у друга. Зависимости (FetchContent тянет SDL3,
# QuickJS-ng, Box2D, RmlUi, Dear ImGui, glslang, SPIRV-Cross с github.com)
# кэшируются между запусками — первый прогон самый долгий.
#
# ЧТО НУЖНО СДЕЛАТЬ ВЛАДЕЛЬЦУ (без этого релиз не опубликуется):
#   Настройки репозитория → «Секреты и переменные» → секрет RELEASE_API_KEY.
#   Это публичный API-ключ GitVerse с правом «Репозитории → Запись».
#   Имя секрета НЕ должно начинаться с GITVERSE_ — такой префикс запрещён
#   платформой (в документации GitVerse пример с GITVERSE_API_KEY неверен).
#
# Триггер: пуш тега вида v0.2.0 — как `git push origin v0.2.0`. Плюс ручной
# запуск из вкладки CI/CD. На обычный пуш в main ничего не собирается.
#
# КВОТА АРТЕФАКТОВ: на все репозитории даётся 500 МБ, срок жизни артефакта —
# 30 дней. Один прогон кладёт ~21 МБ (два архива), так что на релизы хватает
# с запасом.
# ===========================================================================
name: Release

# ВЫКЛЮЧЕН. Пока релизы собираются и публикуются локально — build_and_push.sh
# поднимает версию и выкладывает архивы сразу на GitVerse и на hub.mos.ru.
# Поэтому автоматического триггера нет: только ручной запуск из вкладки CI/CD.
#
# Чтобы включить обратно, верните сюда триггер по тегу:
#   on:
#     push:
#       tags:
#         - 'v[0-9]+.[0-9]+.[0-9]+'
#     workflow_dispatch:
# и заведите секрет RELEASE_API_KEY (см. шапку файла ниже).
on:
  workflow_dispatch:

env:
  #: Собираем мимо dist/: в репозитории dist/ уже лежат архивы (в том числе
  #: macOS) от локального build_and_push.sh, и они не должны попасть в релиз.
  OUT_DIR: dist-ci

jobs:
  # -------------------------------------------------------------------------
  # Linux x86_64 — обычная нативная сборка на самом раннере.
  # -------------------------------------------------------------------------
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Набор пакетов повторяет tools/docker/Dockerfile.linux-builder —
      # тот же образ, в котором сборка идёт локально.
      - name: Зависимости сборки
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake ninja-build pkg-config git ca-certificates \
            python3 zip unzip curl \
            glslang-tools spirv-cross patchelf \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev \
            libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev \
            libudev-dev libdbus-1-dev \
            libfreetype-dev

      # Зависимости прибиты к конкретным коммитам (GIT_TAG в cmake/*.cmake),
      # поэтому ключ кэша статический. Меняете зависимости — поднимите версию
      # в ключе (v1 → v2), иначе останется старый кэш.
      - name: Кэш собранных зависимостей
        uses: actions/cache@v4
        with:
          path: build-autobuild/linux-x86_64/_deps
          key: r2d-deps-linux-v1

      - name: Сборка и упаковка
        run: |
          python3 tools/autobuild.py --no-docker \
            --platforms linux-x86_64 --out "$OUT_DIR"

      - name: Что получилось
        run: ls -lh "$OUT_DIR"

      - name: Артефакт для job'а релиза
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          # Путь задан литералом, а не ${{ env.OUT_DIR }}: в `with:` чужого
          # действия подстановка переменных — лишний риск, а имя каталога
          # одно и то же во всём файле.
          path: dist-ci/russiano2d-linux-x86_64.tar.gz
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Windows x86_64 — кросс-компиляция MinGW. Freetype для RmlUi собирается из
  # исходников прямо под MinGW: готового пакета в Ubuntu нет, а без него
  # CMake не находит Freetype при кросс-сборке (см. Dockerfile.linux-builder).
  # -------------------------------------------------------------------------
  windows:
    name: Windows x86_64 (MinGW)
    runs-on: ubuntu-latest
    env:
      # Тот же источник, что в tools/docker/Dockerfile.linux-builder: savannah
      # недоступен из РФ, а в пуле Ubuntu лежит идентичный upstream-тарболл.
      FREETYPE_URL: https://archive.ubuntu.com/ubuntu/pool/main/f/freetype/freetype_2.13.2+dfsg.orig.tar.xz
      FREETYPE_SHA256: 48c78a4194adfcd15a4d089f3206dab8454c311f5577f3ef7eaef95f777f86e6
      MINGW_ROOT: /usr/x86_64-w64-mingw32
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Кросс-компилятор MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake ninja-build pkg-config git ca-certificates \
            python3 zip unzip curl xz-utils patchelf \
            glslang-tools spirv-cross \
            mingw-w64

      # Кладём freetype в кросс-корень MinGW, чтобы find_package(Freetype)
      # находил его без плясок с CMAKE_PREFIX_PATH.
      - name: Freetype под MinGW
        run: |
          set -eux
          curl -fL --connect-timeout 10 --max-time 300 \
            --retry 5 --retry-delay 3 --retry-all-errors \
            -o /tmp/freetype.tar.xz "$FREETYPE_URL"
          echo "$FREETYPE_SHA256  /tmp/freetype.tar.xz" | sha256sum -c -
          mkdir -p /tmp/freetype
          tar -xJf /tmp/freetype.tar.xz -C /tmp/freetype --strip-components=1
          cd /tmp/freetype
          ./configure --host=x86_64-w64-mingw32 --prefix="$MINGW_ROOT" \
            --without-harfbuzz --without-bzip2 --without-brotli \
            --without-png --without-zlib --enable-static --disable-shared
          make -j"$(nproc)"
          sudo make install

      - name: Кэш собранных зависимостей
        uses: actions/cache@v4
        with:
          path: build-autobuild/windows-x86_64/_deps
          key: r2d-deps-windows-v1

      - name: Сборка и упаковка
        run: |
          python3 tools/autobuild.py --no-docker \
            --platforms windows-x86_64 --out "$OUT_DIR"

      - name: Что получилось
        run: ls -lh "$OUT_DIR"

      - name: Артефакт для job'а релиза
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist-ci/russiano2d-windows-x86_64.zip
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Публикация. Забирает оба архива, считает общие контрольные суммы и
  # создаёт релиз по тегу.
  # -------------------------------------------------------------------------
  release:
    name: Публикация релиза
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Забрать оба архива
        uses: actions/download-artifact@v4
        with:
          path: dist-ci

      # download-artifact раскладывает по подкаталогам со своими именами,
      # поэтому сначала приводим dist-ci/ к тому же виду, что и локальный.
      - name: Разложить архивы и посчитать SHA256SUMS
        run: |
          set -eux
          find "$OUT_DIR" -name 'russiano2d-*' -type f -exec mv -v {} "$OUT_DIR"/ \;
          cd "$OUT_DIR"
          sha256sum russiano2d-linux-x86_64.tar.gz \
                    russiano2d-windows-x86_64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Действие написано на Go — ему нужен тулчейн в раннере.
      - name: Go для create-release
        uses: actions/setup-go@v4
        with:
          go-version: '>=1.23'

      - name: Создать релиз на GitVerse
        uses: actions/create-release@v1
        with:
          api_key: ${{ secrets.RELEASE_API_KEY }}
          title: Russiano2D ${{ gitverse.ref_name }}
          body: |
            Сборки Russiano2D ${{ gitverse.ref_name }} для Linux и Windows.

            Внутри архивов: движок, `assets/`, `game/`, документация и
            `lib/` с внешними библиотеками (Linux ищет их через `$ORIGIN/lib`).

            Контрольные суммы — в `SHA256SUMS.txt`, скачайте его вместе с
            архивами: `sha256sum -c SHA256SUMS.txt`.

            macOS здесь нет: он собирается локально и лежит в `dist/`
            репозитория. Полная история — в `CHANGELOG.md`.
          files: |
            dist-ci/russiano2d-linux-x86_64.tar.gz
            dist-ci/russiano2d-windows-x86_64.zip
            dist-ci/SHA256SUMS.txt
          draft: false
          pre_release: false
