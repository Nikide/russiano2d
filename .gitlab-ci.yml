# ---------------------------------------------------------------------------
# Mos.Hub (GitLab CI): Linux x86_64 + Windows x86_64 (MinGW) и релиз по тегу.
#
# Разделение ответственности — docs/RELEASING.md:
#   * Linux и Windows здесь собираются и упаковываются; архивы уходят в артефакты
#     job'ов и прикладываются к релизу тега;
#   * macOS НЕ собирается: он собирается на рабочем Mac и уже лежит в dist/
#     репозитория (витрина) — job macos-artifacts только забирает его оттуда и
#     передаёт в релиз;
#   * релиз создаётся только по тегу vX.Y.Z: `release:` этого файла. Других
#     механизмов создания релизов на этом хостинге у проекта нет.
#
# Раннер: тег appsechub — так помечен раннер, доступный этому проекту на
# Mos.Hub. Если раннер переименуют, поменяйте тег здесь (или зарегистрируйте
# раннер с этим тегом).
# ---------------------------------------------------------------------------

stages: [static, build, package, release]

default:
  tags: ["appsechub"]
  interruptible: true

variables:
  # Клонируем без истории: сборке она не нужна, а репозиторий с витриной dist
  # весит много.
  GIT_DEPTH: "1"
  DEBIAN_FRONTEND: "noninteractive"

# --- Быстрые гейты: доки, переносимость, контракт упаковки ------------------
static:
  stage: static
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq && apt-get install -y -qq python3 git
  script:
    - python3 tests/portability_test.py
    - python3 tests/doc_coverage_test.py
    - python3 tests/doc_claims_test.py
    - python3 tests/format_extensions_test.py
    - python3 tests/checklist_test.py
    - python3 tests/acceptance_test.py
    - python3 tests/repository_hygiene_test.py
    - python3 tests/package_docs_refresh_test.py
    - python3 tests/release_ownership_test.py

# --- Linux x86_64: сборка, тесты в обеих конфигурациях, пакет ---------------
linux-x86_64:
  stage: build
  image: ubuntu:24.04
  timeout: 2h
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq build-essential cmake ninja-build pkg-config git python3
      libfreetype-dev patchelf libx11-dev libxext-dev libxrandr-dev libxcursor-dev
      libxi-dev libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev
      libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev libudev-dev
      libdbus-1-dev libcurl4-openssl-dev xvfb mesa-vulkan-drivers
  script:
    - cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release
    - cmake --build build-ci --config Release --parallel 4
    - cmake -S . -B build-2d-ci -DCMAKE_BUILD_TYPE=Release -DR2D_ENABLE_RE2D=OFF
    - cmake --build build-2d-ci --config Release --parallel 4
    - python3 tools/ci_verify.py --build-dir build-ci --re2d on
    - python3 tools/ci_verify.py --build-dir build-2d-ci --re2d off
    - python3 tools/ci_package.py --build-dir build-ci --platform linux-x86_64
  artifacts:
    name: "russiano2d-$CI_COMMIT_REF_SLUG-linux-x86_64"
    paths:
      - dist-ci/*.tar.gz
      - dist-ci/SHA256SUMS.txt
    expire_in: 30 days

# --- Windows x86_64: кросс-сборка MinGW в том же образе ----------------------
windows-x86_64:
  stage: build
  image: ubuntu:24.04
  timeout: 2h
  variables:
    # FreeType для MinGW: RmlUi без него не собирается, а готового пакета под
    # MinGW в Ubuntu нет — собираем статически, как это делает
    # tools/docker/Dockerfile.linux-builder.
    FREETYPE_URL: "https://archive.ubuntu.com/ubuntu/pool/main/f/freetype/freetype_2.13.2+dfsg.orig.tar.xz"
    FREETYPE_SHA256: "48c78a4194adfcd15a4d089f3206dab8454c311f5577f3ef7eaef95f777f86e6"
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq build-essential cmake ninja-build pkg-config git python3
      mingw-w64 xz-utils curl zip
    - |
      set -e
      curl -fL --connect-timeout 10 --max-time 300 --retry 5 --retry-delay 3 \
        -o /tmp/freetype.tar.xz "$FREETYPE_URL"
      echo "$FREETYPE_SHA256  /tmp/freetype.tar.xz" | sha256sum -c -
      mkdir -p /tmp/freetype && tar -xJf /tmp/freetype.tar.xz -C /tmp/freetype --strip-components=1
      cd /tmp/freetype
      ./configure --host=x86_64-w64-mingw32 --prefix=/usr/x86_64-w64-mingw32 \
        --without-harfbuzz --without-bzip2 --without-brotli --without-png --without-zlib \
        --enable-static --disable-shared
      make -j"$(nproc)" && make install
  script:
    - >
      cmake -S . -B build-win -DCMAKE_BUILD_TYPE=Release
      -DCMAKE_SYSTEM_NAME=Windows
      -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc
      -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++
      -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres
      -DCMAKE_FIND_ROOT_PATH=/usr/x86_64-w64-mingw32
      -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER
      -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY
      -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY
    - cmake --build build-win --config Release --parallel 4
    - python3 tools/ci_package.py --build-dir build-win --platform windows-x86_64
  artifacts:
    name: "russiano2d-$CI_COMMIT_REF_SLUG-windows-x86_64"
    paths:
      - dist-ci/*.zip
      - dist-ci/SHA256SUMS.txt
    expire_in: 30 days

# --- macOS: не собираем, забираем готовое из витрины dist/ -------------------
macos-artifacts:
  stage: package
  image: ubuntu:24.04
  script:
    - |
      set -e
      version=$(python3 -c "import sys; sys.path.insert(0,'tools'); import release; print(release.read_version())")
      echo "версия проекта: $version"
      mkdir -p out
      found=0
      for a in dist/russiano2d-v$version-macos-*.tar.gz; do
        [ -e "$a" ] || continue
        cp "$a" out/ && found=$((found+1))
        echo "забран из витрины: $a"
      done
      if [ "$found" -eq 0 ]; then
        echo "!! в dist/ нет macOS-архивов версии $version — соберите их локально"
        echo "   (python3 tools/autobuild.py --platforms macos-arm64,macos-x86_64 --out dist)"
        exit 1
      fi
  artifacts:
    name: "russiano2d-$CI_COMMIT_REF_SLUG-macos"
    paths:
      - out/*.tar.gz
    expire_in: 30 days

# --- Релиз по тегу vX.Y.Z: Linux + Windows + macOS из dist/ ------------------
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [linux-x86_64, windows-x86_64, macos-artifacts]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  script:
    - |
      set -e
      version=$(python3 -c "import sys; sys.path.insert(0,'tools'); import release; print(release.read_version())" 2>/dev/null || echo "")
      echo "тег: $CI_COMMIT_TAG, версия проекта: ${version:-неизвестна}"
      if [ -n "$version" ] && [ "$CI_COMMIT_TAG" != "v$version" ]; then
        echo "!! тег $CI_COMMIT_TAG не совпадает с версией проекта v$version"
        exit 1
      fi
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Russiano2D $CI_COMMIT_TAG"
    description: |
      Собрано CI: Linux x86_64, Windows x86_64 (MinGW).
      macOS (arm64, x86_64) собран на рабочем Mac и взят из dist/ репозитория.
      Контрольные суммы — в архивах и в SHA256SUMS.txt артефактов job'ов.
    assets:
      links:
        - name: "Linux x86_64"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist-ci/russiano2d-v${CI_COMMIT_TAG#v}-linux-x86_64.tar.gz?job=linux-x86_64"
        - name: "Windows x86_64"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist-ci/russiano2d-v${CI_COMMIT_TAG#v}-windows-x86_64.zip?job=windows-x86_64"
        - name: "macOS arm64"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/out/russiano2d-v${CI_COMMIT_TAG#v}-macos-arm64.tar.gz?job=macos-artifacts"
        - name: "macOS x86_64"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/out/russiano2d-v${CI_COMMIT_TAG#v}-macos-x86_64.tar.gz?job=macos-artifacts"
